name: Android build

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Zbuduj testowe APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-app assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Zapisz log kompilacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: error

      - name: Zapisz APK jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legnicki-rynek-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
