name: Android build

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LISTINGS_API_BASE_URL: ${{ secrets.LISTINGS_API_BASE_URL }}
      LISTINGS_API_TOKEN: ${{ secrets.LISTINGS_API_TOKEN }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Wygeneruj Gradle Wrapper
        shell: bash
        run: |
          ./android-app/gradlew -p android-app wrapper --gradle-version 8.9 --distribution-type bin

      - name: Testy jednostkowe
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-app testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee android-unit-tests.log

      - name: Android Lint
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-app lintDebug --stacktrace --no-daemon 2>&1 | tee android-lint.log

      - name: Zbuduj testowe APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-app assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Zapisz logi weryfikacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-logs
          path: |
            android-unit-tests.log
            android-lint.log
            android-build.log
          if-no-files-found: warn

      - name: Zapisz raport lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Zapisz APK jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legnicki-rynek-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
