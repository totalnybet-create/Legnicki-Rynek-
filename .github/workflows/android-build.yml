name: Android build

on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skonfiguruj Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Testy, lint i testowe APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-app clean testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Zapisz raporty i log kompilacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            android-build.log
            android-app/app/build/reports/**
          if-no-files-found: warn

      - name: Zapisz APK jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legnicki-rynek-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
