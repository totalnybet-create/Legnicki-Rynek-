<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062a55">
  <meta name="description" content="Legnicki Rynek — lokalne ogłoszenia, wydarzenia i usługi z Legnicy i okolic.">
  <title>Legnicki Rynek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero" id="top">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="topbar">
          <a class="brand" href="#top"><span class="brand-mark">LR</span><span>Legnicki Rynek</span></a>
          <button class="profile-chip" id="profile-button" type="button" aria-label="Konto użytkownika">Zaloguj</button>
        </div>

        <div class="hero-widgets">
          <div><strong id="current-date">—</strong><span id="current-day">—</span></div>
          <div><strong id="current-time">—</strong><span>czas lokalny</span></div>
          <div><strong>Legnica</strong><span>lokalnie i blisko</span></div>
        </div>

        <form class="search" id="search-form">
          <span aria-hidden="true">⌕</span>
          <label class="sr-only" for="search-input">Szukaj</label>
          <input id="search-input" type="search" placeholder="Czego szukasz? Legnica i okolice" autocomplete="off">
          <button type="button" id="clear-search" aria-label="Wyczyść wyszukiwanie">×</button>
        </form>
      </div>
    </header>

    <main>
      <section class="category-section" aria-labelledby="category-title">
        <h1 class="sr-only" id="category-title">Kategorie ogłoszeń</h1>
        <div class="category-grid" id="category-grid"></div>
      </section>

      <section class="content-section" aria-labelledby="events-title">
        <div class="section-heading">
          <h2 id="events-title">Wydarzenia i Aktualności</h2>
          <button class="text-button" data-view="events">Zobacz więcej →</button>
        </div>
        <div class="horizontal-list" id="events-list"></div>
      </section>

      <section class="content-section" aria-labelledby="ads-title">
        <div class="section-heading">
          <h2 id="ads-title">Polecane ogłoszenia</h2>
          <button class="text-button" data-view="all">Zobacz więcej →</button>
        </div>
        <div class="filter-row" id="filter-row"></div>
        <div class="listing-grid" id="listing-grid"></div>
        <p class="empty-state" id="empty-state" hidden>Nie znaleziono pasujących ogłoszeń.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Główna nawigacja">
      <button class="nav-item active" data-nav="home"><span>⌂</span>Home</button>
      <button class="nav-item" data-nav="categories"><span>▦</span>Kategorie</button>
      <button class="nav-add" id="open-ad" aria-label="Dodaj ogłoszenie"><span>＋</span></button>
      <button class="nav-item" data-nav="messages"><span>▢</span>Wiadomości</button>
      <button class="nav-item" data-nav="profile"><span>♙</span>Profil</button>
    </nav>
  </div>

  <dialog id="ad-dialog">
    <form class="dialog-card" id="ad-form">
      <button type="button" class="dialog-close" data-close="ad-dialog">×</button>
      <p class="eyebrow">Nowe ogłoszenie</p>
      <h2>Dodaj ogłoszenie</h2>
      <label>Tytuł<input name="title" required minlength="4" maxlength="80"></label>
      <label>Kategoria<select name="category" id="ad-category" required></select></label>
      <label>Cena w zł<input name="price" type="number" min="0" step="1" required></label>
      <label>Lokalizacja<input name="location" value="Legnica" required></label>
      <label>Adres zdjęcia<input name="image" type="url" placeholder="https://..."></label>
      <label>Opis<textarea name="description" rows="4" minlength="10" required></textarea></label>
      <button class="primary-button" type="submit">Opublikuj ogłoszenie</button>
      <p class="form-message" id="ad-message"></p>
    </form>
  </dialog>

  <dialog id="login-dialog">
    <form class="dialog-card" id="login-form">
      <button type="button" class="dialog-close" data-close="login-dialog">×</button>
      <p class="eyebrow">Konto</p>
      <h2>Zaloguj się</h2>
      <label>Imię<input name="name" required minlength="2" placeholder="Jan"></label>
      <label>E-mail<input name="email" type="email" required placeholder="jan@example.com"></label>
      <button class="primary-button" type="submit">Zaloguj</button>
      <p class="form-message">Wersja demonstracyjna zapisuje konto wyłącznie w tej przeglądarce.</p>
    </form>
  </dialog>

  <dialog id="details-dialog">
    <article class="dialog-card details-card">
      <button type="button" class="dialog-close" data-close="details-dialog">×</button>
      <img id="details-image" alt="">
      <p class="eyebrow" id="details-category"></p>
      <h2 id="details-title"></h2>
      <strong class="details-price" id="details-price"></strong>
      <p id="details-description"></p>
      <p class="details-location" id="details-location"></p>
      <button class="primary-button" type="button" id="contact-seller">Napisz do sprzedającego</button>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
